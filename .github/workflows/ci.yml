name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bench:
        description: Run the hyperfine benchmark
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      # The end-to-end tests drive real zsh, bash and fish shells (each
      # skipped if missing) and cross-check against the real kubectl.
      - name: Install shells (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y zsh fish
      - name: Install shells (macOS)
        if: runner.os == 'macOS'
        run: brew install fish
      - uses: azure/setup-kubectl@v5
      - run: go vet ./...
      - run: go test -race ./...

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: golangci/golangci-lint-action@v9
        with:
          version: v2.15

  goreleaser-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - uses: goreleaser/goreleaser-action@v7
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --snapshot --clean --skip=publish

  bench:
    if: github.event_name == 'workflow_dispatch' && inputs.bench
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Install hyperfine (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y hyperfine
      - name: Install hyperfine (macOS)
        if: runner.os == 'macOS'
        run: brew install hyperfine
      - run: scripts/bench.sh "$GITHUB_STEP_SUMMARY"
